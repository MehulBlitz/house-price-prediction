name: Retrain & refresh metrics

on:
  schedule:
    - cron: "41 6 3 * *"   # monthly: 06:41 UTC on the 3rd
  workflow_dispatch:        # manual run button
  push:
    paths: [ "train_house.py", "transformers.py" ]

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train + generate figures
        run: python train_house.py

      - name: Commit refreshed metrics + figures
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Note: the ~90 MB trained forest is intentionally NOT committed
          # (would bloat git history past GitHub limits). The app auto-trains
          # on first run, and metrics/figures capture the model's state.
          git add artifacts/metrics.json artifacts/learning_curves.json figures/ || true
          if git diff --cached --quiet; then
            echo "No metric changes since last run"
          else
            git commit -m "chore: refresh metrics (scheduled retrain) [skip ci]"
            git push
          fi
